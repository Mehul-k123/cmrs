# One-command local stack: Postgres + Django API + React SPA (nginx).
#   docker compose up --build   →  http://localhost:8080   (API docs: http://localhost:8000/api/docs/)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cmrs
      POSTGRES_PASSWORD: cmrs
      POSTGRES_DB: cmrs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmrs"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: local-compose-secret-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: postgres://cmrs:cmrs@db:5432/cmrs
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
