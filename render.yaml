# Render Blueprint: New → Blueprint → select this repo. Creates DB, API, SPA and a daily cron.
databases:
  - name: cmrs-db
    plan: free
    databaseName: cmrs
    user: cmrs

services:
  - type: web
    name: cmrs-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo --if-empty && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: cmrs-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PAYMENT_GATEWAY_WEBHOOK_SECRET
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: cmrs-api-8eng.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://cmrs-api-8eng.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://cmrs-web.onrender.com

  - type: web
    name: cmrs-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cmrs-api-8eng.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY

